services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: odentaler
      POSTGRES_USER: odentaler
      POSTGRES_PASSWORD: "${ODENTALER_DB_PASSWORD:?Datenbankpasswort in .env setzen}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odentaler", "-d", "odentaler"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql://odentaler:${ODENTALER_DB_PASSWORD:?Datenbankpasswort in .env setzen}@db:5432/odentaler"
      ODENTALER_ENV: "${ODENTALER_ENV:-production}"
      ODENTALER_WEB_ADMIN_PASSWORD: "${ODENTALER_WEB_ADMIN_PASSWORD:-}"
      ODENTALER_WEB_ADMIN_ORIGIN: "${ODENTALER_WEB_ADMIN_ORIGIN:-}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
  tls:
    image: caddy:2-alpine
    environment:
      ODENTALER_HOST: "${ODENTALER_HOST:-cashless.local}"
    ports:
      - "${ODENTALER_BIND_ADDRESS:-127.0.0.1}:${ODENTALER_TLS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  tls_data:
  tls_config:
